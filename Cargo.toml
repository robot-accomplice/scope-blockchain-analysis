[package]
name = "scope-bca"
version = "0.4.4"
edition = "2024"
authors = ["Jon Machen <robot@accomplice.ch>"]
description = "Scope Blockchain Analysis - A production-grade tool for blockchain data analysis, address management, and transaction investigation"
license = "MIT"
readme = "README.md"
repository = "https://github.com/robot-accomplice/scope-blockchain-analysis"
homepage = "https://github.com/robot-accomplice/scope-blockchain-analysis"
keywords = ["blockchain", "ethereum", "cli", "analysis", "crypto"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]
exclude = [
    ".github/",
    "tests/fixtures/",
    "CHANGELOG.md",
    "TESTS.md",
    "PR_BODY.md",
    "justfile",
]

[lib]
name = "scope"
path = "src/lib.rs"

[[bin]]
name = "scope"
path = "src/main.rs"

[features]
default = []
web = []

[dependencies]
# CLI framework
clap = { version = "4.0", features = ["derive", "cargo"] }
clap_complete = "4"
indicatif = "0.17"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
base64 = "0.22"
dirs = "5.0"
async-trait = "0.1"
bs58 = "0.5"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# ASCII chart rendering
textplots = "0.8"

# URL encoding for API queries
urlencoding = "2.1"

# Interactive REPL
rustyline = "14"

# Terminal UI for live monitor
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
sha2 = "0.10.9"
hex = "0.4"
regex = "1"

# Web server for browser mode
axum = { version = "0.7", features = ["json", "ws", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
owo-colors = "4.2.3"

# Daemon support (Unix signal handling)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Async test utilities
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }

# Temporary files for testing
tempfile = "3.10"

# HTTP mocking
mockito = "1.2"

# CLI testing
assert_cmd = "2.0"
predicates = "3.0"
