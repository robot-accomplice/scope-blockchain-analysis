# Scope Monitor Configuration Schema
# Configuration lives in the `monitor:` section of ~/.scope-bca/config.yaml

# ============================================================
# These fields are active and used by `scope monitor`
# ============================================================

monitor:
  # Refresh interval in seconds (affects API polling and UI updates)
  refresh_seconds: 10

  # Exchange venue for the monitor (e.g. binance). `--venue` overrides it.
  venue: null

  # The keys layout, widgets, scale, color_scheme, export and
  # auto_pause_on_input belonged to the removed dashboard. Scope ignores
  # them and prints one line on stderr when it loads a config that has them.

  # Alert thresholds — each one becomes a rule on the watchlist
  # All fields are optional; set to null to disable.
  alerts:
    price_min: null           # Alert when price drops below this USD value
    price_max: null           # Alert when price exceeds this USD value
    whale_min_usd: null       # Whale detection: alert when avg tx size >= this USD value
    volume_spike_threshold_pct: null  # Alert on volume spike exceeding this % over rolling average
