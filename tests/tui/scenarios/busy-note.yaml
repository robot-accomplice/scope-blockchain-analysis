name: Ctrl-D while a command runs explains why it waits
tiers: [offline]
steps:
  - type: "market summary USDC --venue binance --every 5s --duration 1m"
  - key: Enter
  - wait_for: { text: "running" }
  - key: Ctrl-D
  # The note joins the scrollback above the live output, so scroll up to it.
  - key: PageUp
  - key: PageUp
  - key: PageUp
  - wait_for: { text: "A command is running; Esc or Ctrl-C cancels it first." }
  - key: Esc
  - key: PageDown
  - key: PageDown
  - key: PageDown
  - key: PageDown
  - wait_for: { text: "Cancelled" }
  - key: Ctrl-D
  - expect_exit: 0
