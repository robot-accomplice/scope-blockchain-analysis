name: SIGTERM restores the terminal and records the signal
tiers: [offline]
# Signals do not exist on Windows.
unix_only: true
steps:
  - type: "ctx"
  - key: Enter
  - wait_for: { text: "Current Context" }
  - signal: TERM
  - expect_exit: 143
  - expect_journal: { argv_prefix: [], outcome: "signal:TERM" }
