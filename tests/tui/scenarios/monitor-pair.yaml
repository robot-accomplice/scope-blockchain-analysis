name: monitor --pair runs from the venue alone, shows the venue's book and trades, and honors --layout
tiers: [offline]
# Wide enough for the full Order Book title in the exchange layout.
terminal: { cols: 220, rows: 50 }
steps:
  # Venue-only mode never calls DexScreener. A DexScreener request would be
  # a replay miss ("no fixture"), and its error would show in the header.
  # The venue's own order book and trades fill their panels (#78).
  - type: "monitor USDC --venue binance --pair USDC_USDT --layout exchange"
  - key: Enter
  - wait_for: { text: "Order Book \\(binance\\)", timeout: 20s }
  - wait_for: { text: "Recent Trades \\(binance\\)", timeout: 20s }
  - expect_screen:
      contains: ["BINANCE USDCUSDT", "Quit"]
      not_contains: ["API Error", "no fixture", "ETHEREUM", "synthetic", "not available"]
  # L switches to the dashboard, which has the activity log. A refresh logs
  # "Updated: $…"; after it, the screen still has no DexScreener miss.
  - type: "l"
  - wait_for: { text: "Updated: \\$", timeout: 20s }
  - expect_screen:
      contains: ["BINANCE USDCUSDT"]
      not_contains: ["API Error", "no fixture", "Venue error"]
  # Below 60x16 the monitor draws only the size message, and q still quits.
  - resize: { cols: 50, rows: 12 }
  - wait_for: { text: "Terminal too small: need at least 60×16" }
  - type: "q"
  - resize: { cols: 220, rows: 50 }
  - wait_for: { text: "Ran outside the TUI: monitor" }
  - expect_journal: { argv_prefix: ["scope", "monitor"], outcome: ok }
  - key: Ctrl-D
  - expect_exit: 0
