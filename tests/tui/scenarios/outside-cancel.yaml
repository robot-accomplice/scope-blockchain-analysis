name: Commands outside the TUI return by themselves; Ctrl-C cancels a prompt
tiers: [offline]
steps:
  # The setup wizard waits at a stdin prompt. Ctrl-C (SIGINT on the cooked
  # terminal) cancels it, and the TUI comes back and keeps working.
  - type: "setup"
  - key: Enter
  - wait_for: { text: "API key" }
  - key: Ctrl-C
  - wait_for: { text: "Ran outside the TUI: setup \\(cancelled, \\d+\\.\\ds\\)" }
  - expect_journal: { argv_prefix: ["scope", "setup"], outcome: cancelled }
  - type: "ctx"
  - key: Enter
  - wait_for: { text: "Current Context" }
  - key: Ctrl-D
  - expect_exit: 0
