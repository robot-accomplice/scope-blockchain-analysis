name: with NO_COLOR the repeat deviation chart still holds the band, the names and the signed values (design 2026-11-11, item 1)
tiers: [offline]
env: { NO_COLOR: "1" }
terminal: { cols: 120, rows: 40 }
masks: ['scope v\d+\.\d+\.\d+\S*']
steps:
  # The repeat view has its own path to the venue charts (`venue_charts_of`),
  # so the unit tests on a test backend do not cover it. The deviation chart
  # takes the place of the old percent chart, after the mid price.
  - type: "market summary USDC --venue binance,weex --every 2s --duration 8s"
  - key: Enter
  - wait_for: { text: "run 3 of", timeout: 30s }
  - expect_screen:
      contains: ["Mid price", "Peg deviation \\(bps\\)", "venues: Mid price"]
      not_contains: ["Peg deviation %", "no fixture"]
  # The chart keys work in the finished view: Esc stops the run, and the view
  # stays. Tab moves the legend to the deviation chart: it names the band and
  # shows each venue with a signed value and a status glyph.
  - key: Esc
  - wait_for: { text: "Cancelled after", timeout: 10s }
  - key: Tab
  - expect_screen:
      contains: ["venues: Peg deviation \\(bps\\)", "band ±10 bps", "> ■ binance +[+-]?\\d+\\.\\d", "■ weex +[+-]?\\d+\\.\\d"]
  # The deviation chart keeps its line when one venue is isolated (bars
  # would hide the sign).
  - type: " "
  - expect_screen:
      contains: ["Peg deviation \\(bps\\)", "band ±10 bps"]
  # Any other key leaves the view.
  - key: Esc
  - wait_for: { text: "runs · ", timeout: 5s }
  - key: Ctrl-D
  - expect_exit: 0
