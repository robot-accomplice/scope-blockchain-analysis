name: the watch grid draws the peg deviation chart first, and says when the window is too small (design 2026-11-11, item 1)
tiers: [offline]
terminal: { cols: 120, rows: 40 }
masks: ['scope v\d+\.\d+\.\d+\S*']
steps:
  # A target on two recorded venues. The unit tests use a test backend;
  # this runs the real binary.
  - type: "monitor USDC --venue binance,weex --every 2s --duration 12s"
  - key: Enter
  - wait_for: { text: "monitor wizard", timeout: 10s }
  - key: Ctrl-R
  - wait_for: { text: "watchlist monitor-usdc", timeout: 10s }
  - wait_for: { text: "run 3 of", timeout: 30s }
  - key: Enter
  - wait_for: { text: "venues:", timeout: 5s }
  - expect_screen:
      contains: ["Peg deviation \\(bps\\)", "venues: Peg deviation \\(bps\\)", "band ±10 bps", "■ binance", "■ weex"]
      not_contains: ["no fixture"]
  # A narrow window: the chart is still there.
  - resize: { cols: 79, rows: 24 }
  - wait_for: { text: "band ±10 bps", timeout: 5s }
  - expect_screen: { contains: ["Peg deviation \\(bps\\)"] }
  # A window under the lowest pane says how much to enlarge it.
  - resize: { cols: 50, rows: 12 }
  - wait_for: { text: "Window too small", timeout: 5s }
  - resize: { cols: 120, rows: 40 }
  - wait_for: { text: "band ±10 bps", timeout: 5s }
  - key: Esc
  - key: Esc
  - wait_for: { text: "Stopped after", timeout: 10s }
  - key: Esc
  - key: Ctrl-D
  - expect_exit: 0
