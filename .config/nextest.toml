# =============================================================================
# BCA - Nextest Configuration
# =============================================================================
#
# Configuration for cargo-nextest, the next-generation test runner.
# See: https://nexte.st/book/configuration.html
#
# =============================================================================

[profile.default]
# Number of retries for flaky tests (0 = no retries)
retries = 0

# Show slow tests after this duration
slow-timeout = { period = "30s", terminate-after = 2 }

# Fail fast on first test failure in CI
fail-fast = true

# Status level for test output
status-level = "pass"

# Final status level shown at end
final-status-level = "fail"

[profile.ci]
# CI-specific profile with stricter settings
retries = 0
fail-fast = true

# Shorter timeout for CI to catch hanging tests
slow-timeout = { period = "20s", terminate-after = 1 }

# More verbose output for debugging CI failures
status-level = "all"
final-status-level = "all"

[profile.local]
# Local development profile - more lenient settings
retries = 1
fail-fast = false

# Longer timeout for local debugging
slow-timeout = { period = "60s", terminate-after = 3 }

status-level = "pass"
final-status-level = "fail"
