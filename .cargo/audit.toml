# cargo-audit configuration, read by the CI Security Audit job and the local
# pre-push hook, so the two use one ignore list (#40).
# See: https://github.com/rustsec/rustsec/tree/main/cargo-audit

[advisories]
# RUSTSEC-2025-0119: number_prefix is unmaintained (a warning). indicatif 0.17 pulls it in; 0.18 does not.
# RUSTSEC-2024-0449: unsafe-libyaml is unmaintained (a warning, no known
#   vulnerability). serde_yaml pulls it in. scope parses only YAML it ships
#   or the user's own files (config, venues, tokens, address book), never
#   YAML from the network. Remove this when scope is off serde_yaml (#118).
ignore = ["RUSTSEC-2025-0119", "RUSTSEC-2024-0449"]
