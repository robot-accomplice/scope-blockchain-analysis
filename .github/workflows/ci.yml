name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  windows:
    name: Windows
    # Windows is not a release target, but scope must build, pass clippy
    # and pass its tests and the offline TUI harness scenarios there
    # (under ConPTY; the signal, Ctrl-Z and paste scenarios are unix-only).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo build --bin scope
      - run: cargo run -q -p scope-tui-harness -- run --tier offline

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  build:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Ubuntu 22.04, as the release builds it: the oldest glibc we support.
        os: [ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Check the glibc it needs
        if: runner.os == 'Linux'
        run: scripts/check-glibc.sh target/release/scope

  # The release cross-builds arm64 Linux; build it here too, so a dependency
  # whose C code does not cross-compile fails a PR, not a tagged release.
  build-arm64:
    name: Build Release (aarch64-linux, cross)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --target aarch64-unknown-linux-gnu
      - name: Check the glibc it needs
        run: scripts/check-glibc.sh target/aarch64-unknown-linux-gnu/release/scope

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
