name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu, so the binary runs on its glibc
          # (2.35) and newer: built on ubuntu-latest it needed 2.39.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x64
            archive: zip
            
    steps:
      - uses: actions/checkout@v6
      
      - uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.target }}
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # A binary that does not start is not released. A cross-built one
      # cannot run on this runner.
      - name: Smoke run
        if: ${{ !matrix.cross }}
        shell: bash
        run: ./target/${{ matrix.target }}/release/scope --version

      - name: Check the glibc it needs
        if: runner.os == 'Linux'
        run: scripts/check-glibc.sh ./target/${{ matrix.target }}/release/scope

      - name: Package
        if: matrix.archive != 'zip'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../scope-${{ matrix.suffix }}.tar.gz scope
          cd ../../..
          shasum -a 256 scope-${{ matrix.suffix }}.tar.gz > scope-${{ matrix.suffix }}.tar.gz.sha256

      # Windows: a .zip with scope.exe, and its SHA-256 in the same
      # "<hash>  <file>" form as the other targets.
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $zip = "scope-${{ matrix.suffix }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/scope.exe" -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          Set-Content -NoNewline -Path "$zip.sha256" -Value "$hash  $zip`n"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: scope-${{ matrix.suffix }}
          path: |
            ./scope-${{ matrix.suffix }}.tar.gz
            ./scope-${{ matrix.suffix }}.tar.gz.sha256
            ./scope-${{ matrix.suffix }}.zip
            ./scope-${{ matrix.suffix }}.zip.sha256
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          merge-multiple: true
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/*.tar.gz
            ./artifacts/*.zip
            ./artifacts/*.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2

      # Publish order matches the dependency graph:
      #   scope-bca-core  →  scope-bca-cli  →  scope-bca
      # publish-crate.sh skips a version that crates.io already has, so a rerun
      # after a partial release works. Any other error fails the step (#45).
      # The `sleep` between steps
      # gives the crates.io sparse index time to serve the freshly uploaded
      # version before the next crate's verify step tries to resolve it.
      - name: Publish scope-bca-core
        run: scripts/publish-crate.sh scope-bca-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for scope-bca-core to index
        run: sleep 45

      - name: Publish scope-bca-cli
        run: scripts/publish-crate.sh scope-bca-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for scope-bca-cli to index
        run: sleep 45

      - name: Publish scope-bca
        run: scripts/publish-crate.sh scope-bca
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  homebrew:
    name: Update Homebrew tap
    needs: create-release
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
