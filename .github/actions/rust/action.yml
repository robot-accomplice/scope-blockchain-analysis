name: Rust toolchain
description: Install the Rust version pinned in rust-toolchain.toml (#41).
inputs:
  targets:
    description: Extra targets, comma-separated.
    required: false
    default: ""
  components:
    description: Extra components, comma-separated.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: |
        channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
        [ -n "$channel" ] || { echo "::error::rust-toolchain.toml has no channel"; exit 1; }
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
