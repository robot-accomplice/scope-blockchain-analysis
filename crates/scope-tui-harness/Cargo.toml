[package]
name = "scope-tui-harness"
description = "Runs YAML scenarios against the real scope TUI in a PTY"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "scope-tui-harness"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
