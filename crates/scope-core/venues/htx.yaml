id: htx
name: HTX
base_url: https://api.huobi.pro
timeout_secs: 15
rate_limit_per_sec: 10

symbol:
  template: "{base}{quote}"
  default_quote: usdt
  case: lower

error_envelope:
  code_key: status
  ok_codes: ["ok"]
  message_key: err-msg

capabilities:
  order_book:
    path: /market/depth
    params:
      symbol: "{pair}"
      type: step0
    response_root: tick
    response:
      asks_key: asks
      bids_key: bids
      level_format: positional

  ticker:
    path: /market/detail/merged
    params:
      symbol: "{pair}"
    response_root: tick
    response:
      last_price: close
      high_24h: high
      low_24h: low
      volume_24h: amount
      quote_volume_24h: vol
      best_bid: "bid.0"
      best_ask: "ask.0"

  trades:
    # The history endpoint: /market/trade sends only the last tick.
    path: /market/history/trade
    params:
      symbol: "{pair}"
      size: "{limit}"
    max_limit: 2000
    response_root: data
    response:
      nested_items_key: data
      price: price
      quantity: amount
      timestamp_ms: ts
      id: id
      side:
        field: direction
        mapping:
          buy: buy
          sell: sell

  ohlc:
    path: /market/history/kline
    params:
      symbol: "{pair}"
      period: "{interval}"
      size: "{limit}"
    interval_map:
      "1m": "1min"
      "5m": "5min"
      "15m": "15min"
      "30m": "30min"
      "1h": "60min"
      "4h": "4hour"
      "1d": "1day"
      "1w": "1week"
    response_root: data
    response:
      ohlc_format: objects
      open_time: id
      open: open
      high: high
      low: low
      close: close
      ohlc_volume: vol
