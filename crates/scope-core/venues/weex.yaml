id: weex
name: WEEX Spot
base_url: https://api-spot.weex.com
timeout_secs: 15
rate_limit_per_sec: 10

symbol:
  template: "{base}{quote}"
  default_quote: USDT

capabilities:
  order_book:
    # The depth endpoint refuses limit=100; 200 is accepted.
    path: /api/v3/market/depth
    params:
      symbol: "{pair}"
      limit: "200"
    response:
      asks_key: asks
      bids_key: bids
      level_format: positional

  ticker:
    path: /api/v3/market/ticker/24hr
    params:
      symbol: "{pair}"
    response:
      last_price: lastPrice
      high_24h: highPrice
      low_24h: lowPrice
      volume_24h: volume
      quote_volume_24h: quoteVolume
      price_change_pct_24h: priceChangePercent
      best_bid: bidPrice
      best_ask: askPrice

  trades:
    path: /api/v3/market/trades
    params:
      symbol: "{pair}"
      limit: "{limit}"
    max_limit: 1000
    response:
      price: price
      quantity: qty
      quote_quantity: quoteQty
      timestamp_ms: time
      id: id
      side:
        field: isBuyerMaker
        mapping:
          "true": sell
          "false": buy

  ohlc:
    path: /api/v3/market/klines
    params:
      symbol: "{pair}"
      interval: "{interval}"
      limit: "{limit}"
    response:
      ohlc_format: array_of_arrays
      ohlc_fields: [open_time, open, high, low, close, volume, close_time]
