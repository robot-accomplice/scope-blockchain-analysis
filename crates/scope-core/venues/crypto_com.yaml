id: crypto_com
name: Crypto.com
base_url: https://api.crypto.com/exchange/v1
timeout_secs: 15
rate_limit_per_sec: 10

symbol:
  template: "{base}_{quote}"
  default_quote: USDT

error_envelope:
  code_key: code
  ok_codes: ["0"]
  message_key: message

capabilities:
  order_book:
    path: /public/get-book
    params:
      instrument_name: "{pair}"
      depth: "50"
    response_root: "result.data.0"
    response:
      asks_key: asks
      bids_key: bids
      level_format: positional

  ticker:
    path: /public/get-tickers
    params:
      instrument_name: "{pair}"
    response_root: "result.data.0"
    response:
      last_price: a
      high_24h: h
      low_24h: l
      volume_24h: v
      quote_volume_24h: vv
      best_bid: b
      best_ask: k

  trades:
    path: /public/get-trades
    params:
      instrument_name: "{pair}"
      count: "{limit}"
    response_root: "result.data"
    response:
      price: p
      quantity: q
      timestamp_ms: t
      id: d
      side:
        field: s
        mapping:
          buy: buy
          sell: sell
          BUY: buy
          SELL: sell

  ohlc:
    path: /public/get-candlestick
    params:
      instrument_name: "{pair}"
      timeframe: "{interval}"
      count: "{limit}"
    interval_map:
      "1m": "1m"
      "5m": "5m"
      "15m": "15m"
      "30m": "30m"
      "1h": "1h"
      "4h": "4h"
      "1d": "1D"
      "1w": "7D"
    response_root: "result.data"
    response:
      ohlc_format: objects
      open_time: t
      open: o
      high: h
      low: l
      close: c
      ohlc_volume: v
