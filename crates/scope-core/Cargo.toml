[package]
name = "scope-core"
description = "Scope Blockchain Analysis - Core library for blockchain data analysis"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["blockchain", "ethereum", "analysis", "crypto"]
categories = ["cryptography::cryptocurrencies"]
readme = "../../README.md"
exclude = [
    ".github/",
    "tests/fixtures/",
]

[features]
default = []
test-support = []

[lib]
name = "scope"
path = "src/lib.rs"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
base64 = "0.22"
dirs = "5.0"
async-trait = "0.1"
bs58 = "0.5"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# ASCII chart rendering
textplots = "0.8"

# URL encoding for API queries
urlencoding = "2.1"

# Hashing
sha2 = "0.10.9"
hex = "0.4"
regex = "1"

# Terminal coloring
owo-colors = "4.2.3"

# Terminal size detection (used by display/terminal.rs)
crossterm = { version = "0.29" }

# CLI derive for config enums (ValueEnum)
clap = { version = "4.0", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10"
mockito = "1.2"
